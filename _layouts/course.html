---
layout: default
---

<h1>{{ page.title }}</h1>

<p class="course-meta">
  {% if page.code %}
    <strong>{{ page.code }}</strong>
  {% endif %}

  {% if page.credits %}
    · {{ page.credits }} SKS
  {% endif %}

  {% if page.level %}
    · {{ page.level }}
  {% endif %}
</p>

{% if page.semester %}
<p><strong>Semester:</strong> {{ page.semester }}</p>
{% endif %}

<hr>

{{ content }}
