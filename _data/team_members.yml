- name: Harun Ardiansyah
  photo: Harun.png
  info: Lecturer
  short_bio: Harun Ardiansyah is a lecturer at the Department of Nuclear Engineering, Republic of Indonesia Defense University. He received his S.T. (Bachelor of Engineering) degree in nuclear engineering from the Faculty of Engineering, Universitas Gadjah Mada, Yogyakarta, Indonesia, in 2018. He received his M.S. degree in nuclear engineering from the Department of Nuclear Engineering and Radiological Sciences, University of Michigan, United States, in 2021. He received his Ph.D. degree in nuclear engineering from the Department of Nuclear, Plasma, and Radiological Engineering, University of Illinois Urbana-Champaign, United States, in 2025. He joins UNHAN RI as lecturer in 2026. He is interested in Nuclear Reactor Physics and Analysis, Reactor Diagnostics, and Power Reactor Noise Analysis. I am eager to extend my research experience in fuel cycle analysis, reactor dynamics, and technoeconomic analysis.
  email: harun.ardiansyah@idu.ac.id
  website: harunardi.github.io
